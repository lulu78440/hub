# ⚠ MODÈLE DÉSACTIVÉ — préparé par le Labo (orchestrateur, lot 3), jamais activé.
# Ce fichier est rangé dans docs/ : GitHub ne le lit PAS. Pour l'activer, la Commande (avec l'accord de Lucien) doit :
#   1. copier ce fichier dans .github/workflows/donnees.yml, donnees.py dans tools/donnees.py, sources-donnees.json dans donnees/sources.json ;
#   2. décommenter le déclencheur « schedule » ci-dessous si une mise à jour automatique est voulue (sinon : lancement manuel seulement) ;
#   3. vérifier que « raw.githubusercontent.com » est bien dans la CSP du hub (il l'est déjà pour la branche « flux »).
# Principe (modèle : flux.yml) : une tâche GitHub télécharge une LISTE FIXE et PUBLIQUE de séries (sources sans CORS ou à débit limité), les normalise au format « jeu »
# du hub et les publie sur la branche « donnees » (un seul commit, réécrit à chaque fois). Gratuit, sans clé, sans secret. Les données ne sont PAS en direct :
# elles ont l'âge de la dernière exécution, écrit dans chaque jeu (date de mise à jour de la source, ou de la requête si elle l'ignore).
# Le hub lit https://raw.githubusercontent.com/<dépôt>/donnees/donnees/<id>.json avec l'outil lire_serie (source « publie »).
name: Données du hub (désactivé)
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "17 5 * * *"     # une fois par jour à 5 h 17 UTC (à activer seulement si Lucien le veut)
permissions:
  contents: write
concurrency:
  group: donnees
  cancel-in-progress: false
jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reprendre les données précédentes (une série en échec garde sa dernière version)
        run: |
          mkdir -p sortie/donnees
          B="https://raw.githubusercontent.com/${{ github.repository }}/donnees/donnees"
          curl -fsSL "$B/index.json" -o sortie/donnees/index.json || true
          for id in $(python3 -c "import json;print(' '.join(s['id'] for s in json.load(open('sortie/donnees/index.json'))['series']))" 2>/dev/null); do
            curl -fsSL "$B/$id.json" -o "sortie/donnees/$id.json" || true
          done
      - name: Lire les sources
        run: python3 tools/donnees.py donnees/sources.json sortie/donnees
      - name: Publier sur la branche donnees
        run: |
          cd sortie
          git init -q -b donnees
          git config user.name "hub-donnees"
          git config user.email "hub-donnees@users.noreply.github.com"
          git add donnees
          git commit -q -m "Données du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" donnees
